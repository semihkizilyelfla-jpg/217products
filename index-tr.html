<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- THE TURKISH PAGE MOVED TO /tr AND THIS STUB IS WHY THE OLD URL STILL
       WORKS. GitHub Pages serves no server-side redirects, so a permanent move
       has to be expressed in markup: canonical points at the new address,
       noindex keeps this copy out of the index, and the refresh sends a person
       there immediately. It exists because /index-tr.html was already submitted
       to Search Console and Bing — letting a submitted URL start 404ing is a
       worse signal than a slow redirect. Delete it once both consoles show /tr
       indexed and this one crawled. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://217products.com/tr">
  <meta http-equiv="refresh" content="0; url=/tr">
  <title>217 Products</title>
</head>
<body>
  <p>Bu sayfa taşındı: <a href="/tr">217products.com/tr</a></p>
</body>
</html>
